# Trader task tiers (v2 AI layer — trade thesis generation)
trader:
  thesis_generation:
    task_tier: reasoning
    cost_tier: high_quality_reasoning
    models:
      - meituan/longcat-2.0:free
      - stepfun/step-3.7-flash:free
  signal_filtering:
    task_tier: commodity
    cost_tier: cheap_fast
    models:
      - upstage/solar-pro4:free
      - tencent/hy3:free

# Cost tracking lines — per cost_tier
cost_tiers:
  high_quality_reasoning:
    label: "HQ Reasoning"
    tracked: true
  standard:
    label: "Standard"
    tracked: true
  cheap_fast:
    label: "Commodity"
    tracked: true

# Auto-switch rules (rate-limit / quality degradation)
auto_switch:
  enabled: true
  failure_threshold: 3
  cooldown_seconds: 300
  circuit_breaker: gateway  # use gateway circuit breaker state
  quality_degrade_after: 2  # failed responses before degrading tier
