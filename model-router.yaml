# Model Router — Hermes Profile Tier Assignment
# Maps each Hermes profile to the ai-inference-gateway routing tiers.
# Gateway SSOT: ~/Projects/ai-inference-gateway (Kelos model-routing ConfigMap)
#
# Tiers:
#   reasoning   — complex multi-step tasks, trade theses, flagship copy (quality first)
#   coding      — code generation, refactors, engineering work
#   analysis    — log/metric analysis, data comparison, pattern identification
#   commodity   — classification, tagging, summaries, metadata (cost first)
#   emergency   — local fallback only (vLLM qwen3.5-2b-awq / llama.cpp 4B)
#
# Each profile entry: task_tier + model preference order.
# Primary model is first; gateway circuit breaker handles the rest.

profiles:
  # ── C-Suite ──────────────────────────────────────────────────────────────
  caio:
    task_tier: reasoning
    models:
      - meituan/longcat-2.0:free
      - upstage/solar-pro4:free
      - tencent/hy3:free
    cost_tier: high_quality_reasoning
  cro:
    task_tier: reasoning
    models:
      - meituan/longcat-2.0:free
      - upstage/solar-pro4:free
    cost_tier: high_quality_reasoning
